name: plushie_yourself
description: "Turn yourself into an adorable handcrafted plush toy."
publish_to: 'none'

version: 1.0.1+3

environment:
  sdk: '>=3.13.1 <4.0.0'
  flutter: '>=3.47.1'

dependencies:
  flutter:
    sdk: flutter

  # State management
  bloc: ^9.2.1
  flutter_bloc: ^9.1.1
  equatable: ^2.1.0

  # Image
  image_picker: ^1.2.3

  # Network & Utilities
  http: ^1.2.1
  http_parser: ^4.1.2
  dio: ^5.11.0
  flutter_dotenv: ^6.0.1
  url_launcher: ^6.3.2
  meta: ^1.19.0

  # Firebase Auth
  firebase_core: ^4.13.0
  firebase_auth: ^6.5.7
  cloud_firestore: ^6.8.0
  google_sign_in: ^7.2.0
  sign_in_with_apple: ^8.1.0

  # Sharing / saving
  share_plus: ^13.3.0
  path_provider: ^2.1.6
  gal: ^2.3.3

  # DI
  get_it: ^9.2.1

  # UI
  cupertino_icons: ^1.0.9

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4
  change_app_package_name: ^1.5.0

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/app_icon.png"
  min_sdk_android: 21
  remove_alpha_ios: true
  adaptive_icon_background: "#FAF0DC"
  adaptive_icon_foreground: "assets/app_icon.png"
  web:
    generate: true
    image_path: "assets/app_icon.png"
  macos:
    generate: true
    image_path: "assets/app_icon.png"

flutter:
  uses-material-design: true
  assets:
    - .env
    - assets/
